<!--We can visualize html & css on a web by right-click and pick 'inspect' -->
<!--We can find out the html & css of a certain component by using the pointer icon -->

<!--Button has a tendency to follow the width of the text inside-->
<!--It is better to use padding for button, rather then height and width-->

<!--Box model is basically the distribution of spacing that the component carry out-->
<!--Box model consist of margin, border, padding, and the component itself-->

<!--Lets change website part 2, remove the height and width, use padding and margin-->

<button class="subscribe-button">SUBSCRIBE</button> <!--class adalah cara memberikan label pada komponen html-->
<button class="join-button">JOIN</button>
<button class="tweet-button">Tweet</button>

<!--penambahan css-->
<style>
    /* remove all of the height and width */

    /* Default browser menyimpan button dengan teks yang sejajar */

    .subscribe-button { /* 'button' disebut sebagai 'css selector' */
        background-color: rgb(199, 0, 0); /* mengedit semua button menjadi background merah */
        color: white; /* mengubah warna teks menjadi putih */
        border: none; /* menghilangkan semua aspek dari border */
        border-radius: 1px; /* mengatur ketajaman ujung ujung shapes */
        cursor: pointer; /* membuat mouse menjadi pointer ketika melewati tombol */
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
        margin-right: 5px;
        vertical-align: top;
    }

    /* join-button terlihat lebih besar dibanding youtube karena ditambah ketebalan border */
    .join-button {
        background-color: white; /* mengubah warna background menjadi putih */
        color: rgb(29, 95, 218); /* mengubah warna font menjadi biru */
        border-radius: 1px; /* mengatur ketajaman ujung ujung sudut shape */
        border-radius: 3px; /* mengatur ketajaman ujung ujung shapes */
        border-color: rgb(29, 95, 218);  /* mengubah waran border menjadi biru */
        border-style: solid; /* buat warna border rata di semua tempat */
        border-width: 1px; /* mengubah ketebalan border */
        cursor: pointer; /* membuat mouse menjadi pointer ketika melewati tombol */
        margin-right: 8px;
        padding-top: 9px;
        padding-bottom: 9px;
        padding-left: 16px;
        padding-right: 16px;
        vertical-align: top;
    }
    
    .tweet-button {
        background-color: rgb(15, 138, 240); /* mengubah warna background menjadi biru */
        color: white;  /* mengubah warna font menjadi biru */
        border: none; /* menghilangkan semua aspek dari border */
        border-radius: 20px; /* mengatur ketajaman ujung ujung sudut shape */
        cursor: pointer; /* membuat mouse menjadi pointer ketika melewati tombol */
        vertical-align: top;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
    }
</style>
