<!-- instruction to create a button-->
<button>Hello</button> <!-- it shows "button"-->

<!-- Instruction to create a paragraph-->
<p>Paragraph of text</p>

<!-- Instruction are being read one by one (urutan ngaruh)-->
<p>Paragraph of text</p>
<button>Hello</button>

<!-- syntax = rules for writing code = grammar for code-->

<!-- <button> <p> etc are called "html tag"-->

<!-- Instruction to link to another website-->
<a href="https://www.youtube.com/" target="_blank">Link to Youtube</a> 
<!-- pakenya "href" bukan "src"-->
<!-- attribute "target" menentukan apakah link dibuka di tab lain atau tidak-->
<!-- target = blank membuat link dibuat di tab lain-->
